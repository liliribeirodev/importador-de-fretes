services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: importador_app
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: importador_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testello
      MYSQL_USER: importador
      MYSQL_PASSWORD: importador
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: